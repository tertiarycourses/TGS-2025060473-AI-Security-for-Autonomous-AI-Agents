name: Publish lab prompts
on:
  push:
    branches: [master]
    paths: ['prompts/**', 'labs/**', 'index.html', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare learner-only site
        run: |
          mkdir -p site-release
          cp index.html site-release/
          cp -R prompts labs site-release/
          touch site-release/.nojekyll
          if find site-release -type f | grep -Ei '(^|/)(\.env|assessment|trainer-only|reference)(/|$)|/(FG_|Assessment_Plan_|Answer to )'; then
            echo 'Private material in publication tree'; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-release
      - id: deployment
        uses: actions/deploy-pages@v4
